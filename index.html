 <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;

  -webkit-tap-highlight-color: transparent;
}

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      overflow-x:hidden;
      position:relative;
      background:#000;
      padding:20px 15px 50px;
    }
    
/* =========================
   PURPLE PREMIUM INTRO
========================== */

#intro{
  position:fixed;
  inset:0;
  z-index:999999;

  background:#06010d;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;

  animation:introFade 2s ease forwards;
  animation-delay:3s;
}

/* =========================
   BACKGROUND
========================== */

.bg{
  position:absolute;
  inset:0;

  background:
  radial-gradient(
  circle at top,
  rgba(125,0,255,.25),
  #06010d 65%);
}

/* glow */

.bg::before,
.bg::after{
  content:'';
  position:absolute;
  border-radius:50%;
  filter:blur(140px);
}

.bg::before{
  width:450px;
  height:450px;

  background:#7d00ff;

  top:-150px;
  left:-120px;

  opacity:.35;

  animation:float1 10s ease-in-out infinite;
}

.bg::after{
  width:380px;
  height:380px;

  background:#00d9ff;

  bottom:-140px;
  right:-100px;

  opacity:.18;

  animation:float2 10s ease-in-out infinite;
}

/* =========================
   PARTICLES
========================== */

.particles{
  position:absolute;
  inset:0;

  background-image:
  radial-gradient(
  rgba(255,255,255,.08) 1px,
  transparent 1px);

  background-size:45px 45px;

  opacity:.18;

  animation:moveParticles 20s linear infinite;
}

/* =========================
   FLASH EFFECT
========================== */

.flash{
  position:absolute;
  inset:0;

  background:
  linear-gradient(
  120deg,
  transparent,
  rgba(255,255,255,.05),
  transparent
  );

  animation:flashMove 4s linear infinite;
}

/* =========================
   CONTENT
========================== */

.intro-content{
  position:relative;
  z-index:5;

  text-align:center;

  animation:zoomIn 2s ease;
}

/* =========================
   LOGO
========================== */

.logo-ring{
  width:170px;
  height:170px;

  margin:auto;

  border-radius:50%;

  padding:5px;

  background:
  linear-gradient(
  135deg,
  #00d9ff,
  #7d00ff,
  #b700ff
  );

  animation:pulse 4s ease-in-out infinite;

  box-shadow:
  0 0 20px rgba(125,0,255,.45),
  0 0 50px rgba(0,229,255,.12);

  transition:all .6s ease;
}

.intro-logo{
  width:100%;
  height:100%;

  object-fit:cover;

  border-radius:50%;

  border:5px solid #06010d;
}

/* =========================
   INTRO NAME IMAGE
========================== */

.intro-name{
  width:200px;
  margin-top:15px;
  margin-left:-20px;

  animation:
  nameFloat 4s ease-in-out infinite;

  filter:
  drop-shadow(0 0 18px rgba(125,0,255,.45))
  drop-shadow(0 0 35px rgba(36,75,255,.22));

}

@keyframes nameFloat{

  0%,100%{
    transform:
    translateY(0)
    scale(1);
  }

  50%{
    transform:
    translateY(-4px)
    scale(1.02);
  }

}

/* =========================
   LINE
========================== */

.intro-line{
  width:220px;
  height:3px;

  margin:30px auto 0;

  border-radius:20px;

  background:
  linear-gradient(
  90deg,
  transparent,
  #7d00ff,
  #00d9ff,
  transparent
  );

  animation:lineGlow 3s ease-in-out infinite;
}

/* =========================
   ANIMATIONS
========================== */

@keyframes introFade{

  0%{
    opacity:1;
    filter:blur(0);
  }

  100%{
    opacity:0;
    visibility:hidden;
    filter:blur(12px);
  }

}

@keyframes zoomIn{

  from{
    transform:
    scale(1.15);
    opacity:0;
  }

  to{
    transform:
    scale(1);
    opacity:1;
  }

}

@keyframes pulse{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.04);
  }

}

@keyframes titleGlow{

  0%,100%{
    text-shadow:
    0 0 15px rgba(125,0,255,.3);
  }

  50%{
    text-shadow:
    0 0 30px rgba(125,0,255,.6),
    0 0 45px rgba(0,217,255,.2);
  }

}

@keyframes lineGlow{

  0%,100%{
    opacity:.5;
  }

  50%{
    opacity:1;
  }

}

@keyframes flashMove{

  from{
    transform:translateX(-100%);
  }

  to{
    transform:translateX(100%);
  }

}

@keyframes float1{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(35px);
  }

}

@keyframes float2{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-35px);
  }

}

@keyframes moveParticles{

  from{
    transform:
    translateY(0)
    scale(1);
  }

  to{
    transform:
    translateY(-120px)
    scale(1.05);
  }

}

    /* =========================
       BACKGROUND
    ========================== */

body::before{
  content:'';
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;

  background:url('https://i.ibb.co.com/G3ctSzhH/BEGROUND-1.png') center center/cover no-repeat;
  
  z-index:-3;

  /* FIX UTAMA */
  background-attachment: fixed;

  /* HAPUS ini */
  /* transform:scale(1.05); */

  filter:brightness(.8);
}

body::after{
  content:'';
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:-2;
}

    /* =========================
       CONTAINER
    ========================== */

    .container{
      width:100%;
      max-width:420px;
      position:relative;
    }

    /* =========================
       TOP BANNER
    ========================== */

.banner{
  width:100%;
  position:relative;
  border-radius:35px;
  overflow:visible;

  animation:bannerGlow 4s linear infinite;

  filter:
  drop-shadow(0 0 10px rgba(36,75,255,.7))
  drop-shadow(0 0 25px rgba(0,255,255,.18));
}

.banner img{
  width:100%;
  display:block;
  border-radius:35px;
}

@keyframes bannerGlow{

  0%{
    filter:
    drop-shadow(0 0 10px rgba(36,75,255,.7))
    drop-shadow(0 0 25px rgba(0,255,255,.18));
  }

  50%{
    filter:
    drop-shadow(0 0 14px rgba(36,75,255,.7))
    drop-shadow(0 0 30px rgba(0,255,255,.25));
  }

  100%{
    filter:
    drop-shadow(0 0 10px rgba(36,75,255,.7))
    drop-shadow(0 0 25px rgba(0,255,255,.18));
  }

}

    /* =========================
       PROFILE
    ========================== */
    
.profile{
  width:150px;
  height:150px;
  position:absolute;
  left:50%;
  bottom:-70px;
  transform:translateX(-50%);
  border-radius:50%;
  padding:5px;

  background:
  linear-gradient(
  135deg,
  #00f0ff,
  #004cff,
  #7d00ff,
  #ff00c8
  );

  box-shadow:
  0 0 5px #003cff,
  0 0 40px rgba(36,75,255,.7),
  0 0 70px rgba(36,75,255,.7);

  animation:profileGlow 3s ease-in-out infinite;
}

.profile img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #000;
  background:#000;
}

@keyframes profileGlow{

  0%{
    box-shadow:
    0 0 8px ##003cff,
    0 0 18px rgba(36,75,255,.7),
    0 0 35px rgba(0,225,255,.18);
  }

  50%{
    box-shadow:
    0 0 12px #00e1ff,
    0 0 24px rgba(36,75,255,.7),
    0 0 45px rgba(0,225,255,.25);
  }

  100%{
    box-shadow:
    0 0 8px ##003cff,
    0 0 18px rgba(36,75,255,.7),
    0 0 35px rgba(0,225,255,.18);
  }

}

/* =========================
   BIO IMAGE PREMIUM
========================== */

.bio-img{
  width:100%;

  margin-top:90px;

  display:flex;
  justify-content:center;

  animation:bioFade 1.5s ease;
}

.bio-img img{
  width:70%;
  max-width:200px;

  display:block;

  transition:
  transform .5s ease,
  filter .5s ease;

  animation:
  smoothFloat 5s ease-in-out infinite,
  glowBio 4s ease-in-out infinite;
}

/* hover */

.bio-img img:hover{

  transform:
  scale(1.03);

  filter:
  brightness(1.05);

}

/* =========================
   ANIMATION
========================== */

@keyframes bioFade{

  from{
    opacity:0;
    transform:
    translateY(25px);
  }

  to{
    opacity:1;
    transform:
    translateY(0);
  }

}

@keyframes smoothFloat{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-5px);
  }

}

@keyframes glowBio{

  0%,100%{
    filter:
    drop-shadow(0 0 10px rgba(125,0,255,.12));
  }

  50%{
    filter:
    drop-shadow(0 0 22px rgba(125,0,255,.25))
    drop-shadow(0 0 35px rgba(0,217,255,.08));
  }

}

    /* =========================
       BUTTONS
    ========================== */

 .links{
  margin-top:35px;
  display:flex;
  flex-direction:column;
  gap:0px;
}

.btn{
  display:block;
  width:100%;
  transition:.3s;
  position:relative;
  background:transparent;
  padding:0;
  margin:0;
  line-height:0;

  filter:
  drop-shadow(0 0 3px rgba(255,255,255,.05))
  drop-shadow(0 0 8px rgba(0,255,255,.08));
}

.btn img{
  width:100%;
  margin-top:-30px;
  display:block;
  background:transparent;
}

.btn:hover{

  transform:scale(1.02);

  filter:
  drop-shadow(0 0 5px rgba(255,255,255,.12))
  drop-shadow(0 0 12px rgba(0,255,255,.18));

}

    /* =========================
       FOOTER
    ========================== */

    .footer{
      margin-top:30px;
      text-align:center;
      color:rgba(255,255,255,.45);
      font-size:12px;
      letter-spacing:4px;
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media(max-width:480px){

      .profile{
        width:130px;
        height:130px;
        bottom:-60px;
      }

      .bio{
        margin-top:82px;
      }

      .bio h1{
        font-size:22px;
      }

    }

  </style>
</head>

  <script>

    // =========================
    // BUTTON HOVER EFFECT
    // =========================

    const buttons = document.querySelectorAll('.btn')

    buttons.forEach(button => {

      button.addEventListener('mousemove', e => {

        const rect = button.getBoundingClientRect()

        const x = e.clientX - rect.left
        const y = e.clientY - rect.top

        button.style.background = `
        radial-gradient(
        circle at ${x}px ${y}px,
        rgba(255,255,255,.12),
        transparent 60%
        )`

      })

      button.addEventListener('mouseleave', () => {

        button.style.background = 'transparent'

      })

    })
